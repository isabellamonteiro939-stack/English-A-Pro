<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English AI Pro — Aprenda Inglês com IA</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#172554',
            },
            success: '#22c55e',
            error: '#ef4444',
            warning: '#eab308'
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.4);
      border-radius: 20px;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ÍCONES HELPER ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    // --- MOCK DATABASE & CONTENT ---
    const VOCABULARY_CARDS = [
      { id: 1, word: "Resilient", translation: "Resiliente / Capaz de se adaptar", pronunciation: "/rɪˈzɪl.jənt/", example: "She is resilient in the face of challenges.", category: "Personalidade" },
      { id: 2, word: "Schedule", translation: "Agenda / Cronograma", pronunciation: "/ˈskedʒ.uːl/", example: "Let me check my schedule for tomorrow.", category: "Trabalho" },
      { id: 3, word: "Fluency", translation: "Fluência", pronunciation: "/ˈfluː.ən.si/", example: "Fluency comes with daily practice.", category: "Estudos" },
      { id: 4, word: "Opportunity", translation: "Oportunidade", pronunciation: "/ˌɑː.pɚˈtuː.nə.t̬i/", example: "Don't miss this opportunity to travel.", category: "Carreira" }
    ];

    const EXERCISES_DATABASE = [
      {
        id: 1,
        type: "choice",
        question: "Escolha a tradução correta para 'I would like a coffee, please':",
        options: ["Eu quero café agora", "Gostaria de um café, por favor", "Eu gosto de café frio", "Você tem café?"],
        answer: 1,
        explanation: "'Would like' é uma forma polida de dizer 'gostaria' em inglês."
      },
      {
        id: 2,
        type: "fill",
        question: "Preencha a lacuna com a preposição correta: 'I am good ___ speaking English.'",
        options: ["in", "at", "on", "to"],
        answer: 1,
        explanation: "Usamos a preposição 'at' após o adjetivo 'good' para indicar habilidade (good at + verb-ing)."
      },
      {
        id: 3,
        type: "order",
        question: "Organize as palavras para formar a frase correta: [English] [practice] [every] [I] [day]",
        words: ["I", "practice", "English", "every", "day"],
        correctOrder: "I practice English every day",
        explanation: "A ordem padrão em inglês é Sujeito (I) + Verbo (practice) + Objeto (English) + Advérbio (every day)."
      }
    ];

    const SCENARIOS = [
      { id: "restaurant", title: "Pedindo comida no restaurante", icon: "utensils", level: "A1-A2", prompt: "Act as a friendly waiter at a New York bistro. Greet the customer and ask for their order." },
      { id: "interview", title: "Entrevista de Emprego", icon: "briefcase", level: "B1-B2", prompt: "Act as an interviewer at a tech company. Ask the candidate about their strengths and work experience." },
      { id: "airport", title: "Check-in no Aeroporto", icon: "plane", level: "A2-B1", prompt: "Act as an airline counter clerk. Check the user's passport and baggage." },
      { id: "hotel", title: "Reservas e Hotel", icon: "bed", level: "A1-A2", prompt: "Act as a hotel receptionist. Welcome the guest and explain breakfast hours." }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // Estado de Autenticação / Onboarding
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('english_ai_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [onboardingStep, setOnboardingStep] = useState(1);
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        level: 'A2 (Iniciante)',
        goal: 'conversacao',
        dailyTime: '15',
        difficulty: 'falar'
      });

      // Interface / Navegação
      const [activeTab, setActiveTab] = useState('dashboard');
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
      const [showSettings, setShowSettings] = useState(false);

      // Estado de Gamificação
      const [stats, setStats] = useState({
        xp: 340,
        streak: 5,
        dailyGoalMinutes: 15,
        timeStudiedToday: 8,
        level: 'B1 Intermediário'
      });

      // Configuração Dark Mode
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }, [darkMode]);

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('gemini_api_key', key);
        alert('Chave API salva com sucesso!');
      };

      const handleFinishOnboarding = () => {
        const newUser = { ...formData, id: Date.now() };
        setUser(newUser);
        localStorage.setItem('english_ai_user', JSON.stringify(newUser));
      };

      const handleLogout = () => {
        localStorage.removeItem('english_ai_user');
        setUser(null);
        setOnboardingStep(1);
      };

      if (!user) {
        return (
          <Onboarding 
            step={onboardingStep} 
            setStep={setOnboardingStep} 
            formData={formData} 
            setFormData={setFormData}
            onFinish={handleFinishOnboarding}
          />
        );
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">
          {/* Sidebar - Desktop */}
          <aside className="hidden md:flex flex-col w-64 bg-slate-900 text-white p-5 border-r border-slate-800 justify-between">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-brand-500/30">
                  AI
                </div>
                <div>
                  <h1 className="font-extrabold text-lg leading-tight">ENGLISH AI PRO</h1>
                  <span className="text-xs text-brand-400 font-medium">Tutor Inteligente</span>
                </div>
              </div>

              <nav className="space-y-2">
                <NavItem icon="layout-dashboard" label="Dashboard" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                <NavItem icon="book-open" label="Aprender & Módulos" active={activeTab === 'modules'} onClick={() => setActiveTab('modules')} />
                <NavItem icon="video" label="Conversar com IA" active={activeTab === 'tutor'} badge="Live" />
                <NavItem icon="sparkles" label="Exercícios Interativos" active={activeTab === 'exercises'} onClick={() => setActiveTab('exercises')} />
                <NavItem icon="bar-chart-2" label="Seu Progresso" active={activeTab === 'progress'} onClick={() => setActiveTab('progress')} />
              </nav>
            </div>

            <div className="pt-4 border-t border-slate-800 space-y-3">
              <button 
                onClick={() => setShowSettings(true)}
                className="flex items-center gap-3 text-slate-400 hover:text-white text-sm w-full p-2 rounded-lg hover:bg-slate-800 transition"
              >
                <Icon name="settings" className="w-4 h-4" />
                <span>Configurações & API</span>
              </button>
              
              <div className="flex items-center justify-between p-3 rounded-xl bg-slate-800/60 border border-slate-700/50">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center font-bold text-xs text-white">
                    {user.name.charAt(0).toUpperCase() || 'U'}
                  </div>
                  <div className="overflow-hidden">
                    <p className="text-sm font-semibold truncate">{user.name || 'Aluno'}</p>
                    <p className="text-xs text-slate-400 truncate">{user.level}</p>
                  </div>
                </div>
                <button onClick={handleLogout} title="Sair" className="text-slate-400 hover:text-error transition">
                  <Icon name="log-out" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </aside>

          {/* Conteúdo Principal */}
          <main className="flex-1 flex flex-col min-h-screen overflow-y-auto">
            {/* Header Mobile / Topo */}
            <header className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 p-4 flex items-center justify-between md:px-8 sticky top-0 z-30">
              <div className="flex items-center gap-3 md:hidden">
                <div className="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center font-bold text-sm text-white">
                  AI
                </div>
                <span className="font-extrabold text-base">English AI Pro</span>
              </div>

              <div className="hidden md:flex items-center gap-4">
                <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800">
                  Nível Actual: {user.level}
                </span>
              </div>

              <div className="flex items-center gap-4">
                <div className="flex items-center gap-1.5 text-amber-500 font-bold text-sm bg-amber-50 dark:bg-amber-950/30 px-3 py-1 rounded-full border border-amber-200 dark:border-amber-800">
                  <Icon name="flame" className="w-4 h-4 text-amber-500 fill-amber-500" />
                  <span>{stats.streak} dias</span>
                </div>

                <div className="flex items-center gap-1.5 text-brand-600 dark:text-brand-400 font-bold text-sm bg-brand-50 dark:bg-brand-950/30 px-3 py-1 rounded-full border border-brand-200 dark:border-brand-800">
                  <Icon name="zap" className="w-4 h-4 fill-brand-500" />
                  <span>{stats.xp} XP</span>
                </div>

                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition"
                  title="Alternar Tema"
                >
                  <Icon name={darkMode ? "sun" : "moon"} className="w-5 h-5" />
                </button>
              </div>
            </header>

            {/* Renderização das Views */}
            <div className="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
              {activeTab === 'dashboard' && (
                <DashboardView user={user} stats={stats} setActiveTab={setActiveTab} />
              )}
              {activeTab === 'tutor' && (
                <TutorRoomView user={user} apiKey={apiKey} setStats={setStats} />
              )}
              {activeTab === 'modules' && (
                <ModulesView />
              )}
              {activeTab === 'exercises' && (
                <ExercisesView setStats={setStats} />
              )}
              {activeTab === 'progress' && (
                <ProgressView stats={stats} user={user} />
              )}
            </div>
          </main>

          {/* Bottom Navigation — Mobile */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex justify-around p-2 z-40">
            <BottomNavItem icon="layout-dashboard" label="Início" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
            <BottomNavItem icon="book-open" label="Aprender" active={activeTab === 'modules'} onClick={() => setActiveTab('modules')} />
            <BottomNavItem icon="video" label="Conversar" active={activeTab === 'tutor'} isHighlight onClick={() => setActiveTab('tutor')} />
            <BottomNavItem icon="sparkles" label="Praticar" active={activeTab === 'exercises'} onClick={() => setActiveTab('exercises')} />
            <BottomNavItem icon="bar-chart-2" label="Progresso" active={activeTab === 'progress'} onClick={() => setActiveTab('progress')} />
          </nav>

          {/* Modal de Configurações */}
          {showSettings && (
            <SettingsModal 
              apiKey={apiKey} 
              onSaveApiKey={handleSaveApiKey} 
              onClose={() => setShowSettings(false)} 
            />
          )}
        </div>
      );
    }

    // --- COMPONENTES AUXILIARES DE NAVEGAÇÃO ---
    function NavItem({ icon, label, active, onClick, badge }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center justify-between w-full p-3 rounded-xl transition font-medium text-sm ${
            active 
              ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/30' 
              : 'text-slate-400 hover:bg-slate-800 hover:text-white'
          }`}
        >
          <div className="flex items-center gap-3">
            <Icon name={icon} className="w-5 h-5" />
            <span>{label}</span>
          </div>
          {badge && (
            <span className="bg-emerald-500 text-slate-950 font-bold text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider">
              {badge}
            </span>
          )}
        </button>
      );
    }

    function BottomNavItem({ icon, label, active, onClick, isHighlight }) {
      if (isHighlight) {
        return (
          <button onClick={onClick} className="flex flex-col items-center -mt-5">
            <div className="w-12 h-12 rounded-full bg-brand-600 text-white flex items-center justify-center shadow-lg shadow-brand-500/50 border-4 border-slate-50 dark:border-slate-900">
              <Icon name={icon} className="w-6 h-6" />
            </div>
            <span className="text-[10px] font-bold text-brand-600 dark:text-brand-400 mt-1">{label}</span>
          </button>
        );
      }
      return (
        <button 
          onClick={onClick}
          className={`flex flex-col items-center p-1 transition ${active ? 'text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-400'}`}
        >
          <Icon name={icon} className="w-5 h-5" />
          <span className="text-[11px] mt-1">{label}</span>
        </button>
      );
    }

    // --- TELA DE ONBOARDING ---
    function Onboarding({ step, setStep, formData, setFormData, onFinish }) {
      return (
        <div className="min-h-screen bg-slate-900 text-white flex flex-col justify-center items-center p-4">
          <div className="max-w-md w-full bg-slate-800 border border-slate-700/60 rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
            <div className="absolute top-0 right-0 w-32 h-32 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>

            {/* Cabeçalho */}
            <div className="flex items-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center font-bold text-xl text-white">
                AI
              </div>
              <span className="font-extrabold text-lg tracking-wide">English AI Pro</span>
            </div>

            {step === 1 && (
              <div className="space-y-6">
                <div className="text-center space-y-3">
                  <div className="w-20 h-20 bg-brand-600/20 text-brand-400 rounded-full flex items-center justify-center mx-auto border border-brand-500/30">
                    <Icon name="bot" className="w-10 h-10" />
                  </div>
                  <h2 className="text-2xl font-extrabold text-white">Aprenda inglês no seu ritmo com inteligência artificial.</h2>
                  <p className="text-slate-400 text-sm leading-relaxed">
                    Pratique conversação, melhore sua pronúncia e fale inglês com confiança todos os dias.
                  </p>
                </div>

                <div className="space-y-3 pt-2">
                  <input
                    type="text"
                    placeholder="Seu nome completo"
                    value={formData.name}
                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500"
                  />
                  <input
                    type="email"
                    placeholder="Seu e-mail"
                    value={formData.email}
                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500"
                  />
                </div>

                <button
                  onClick={() => formData.name ? setStep(2) : alert("Digite seu nome")}
                  className="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2"
                >
                  <span>Começar Agora</span>
                  <Icon name="arrow-right" className="w-4 h-4" />
                </button>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-6">
                <div>
                  <h3 className="text-xl font-bold mb-1">Qual seu nível de inglês?</h3>
                  <p className="text-xs text-slate-400">Personalizaremos a IA conforme sua resposta.</p>
                </div>

                <div className="space-y-2">
                  {[
                    { title: "Iniciante Zero", level: "A1 (Iniciante)" },
                    { title: "Compreendo palavras simples", level: "A2 (Básico)" },
                    { title: "Consigo manter conversas simples", level: "B1 (Intermediário)" },
                    { title: "Avançado ou Fluente", level: "C1 (Avançado)" }
                  ].map((item, idx) => (
                    <button
                      key={idx}
                      onClick={() => setFormData({...formData, level: item.level})}
                      className={`w-full p-3.5 rounded-xl border text-left text-sm font-medium transition flex items-center justify-between ${
                        formData.level === item.level
                          ? 'border-brand-500 bg-brand-600/20 text-white'
                          : 'border-slate-700 bg-slate-900/50 text-slate-300 hover:bg-slate-700/50'
                      }`}
                    >
                      <span>{item.title}</span>
                      <span className="text-xs text-slate-400 font-normal">{item.level}</span>
                    </button>
                  ))}
                </div>

                <div className="flex gap-3">
                  <button onClick={() => setStep(1)} className="w-1/3 border border-slate-700 rounded-xl text-slate-300 text-sm font-medium hover:bg-slate-800">Voltar</button>
                  <button onClick={() => setStep(3)} className="w-2/3 bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 rounded-xl transition">Continuar</button>
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="space-y-6">
                <div>
                  <h3 className="text-xl font-bold mb-1">Qual o seu objetivo principal?</h3>
                  <p className="text-xs text-slate-400">O que você mais deseja alcançar?</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  {[
                    { id: 'viagens', label: 'Viagens', icon: 'plane' },
                    { id: 'trabalho', label: 'Trabalho / Carreira', icon: 'briefcase' },
                    { id: 'estudos', label: 'Estudos / Exames', icon: 'graduation-cap' },
                    { id: 'conversacao', label: 'Conversação Geral', icon: 'message-square' }
                  ].map((goal) => (
                    <button
                      key={goal.id}
                      onClick={() => setFormData({...formData, goal: goal.id})}
                      className={`p-4 rounded-xl border text-center flex flex-col items-center gap-2 transition ${
                        formData.goal === goal.id
                          ? 'border-brand-500 bg-brand-600/20 text-white'
                          : 'border-slate-700 bg-slate-900/50 text-slate-400 hover:bg-slate-700/50'
                      }`}
                    >
                      <Icon name={goal.icon} className="w-6 h-6 text-brand-400" />
                      <span className="text-xs font-semibold">{goal.label}</span>
                    </button>
                  ))}
                </div>

                <div className="flex gap-3">
                  <button onClick={() => setStep(2)} className="w-1/3 border border-slate-700 rounded-xl text-slate-300 text-sm font-medium">Voltar</button>
                  <button onClick={onFinish} className="w-2/3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/30">Criar Meu Plano</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- DASHBOARD VIEW ---
    function DashboardView({ user, stats, setActiveTab }) {
      return (
        <div className="space-y-6">
          {/* Hero Banner */}
          <div className="bg-gradient-to-r from-brand-700 via-brand-600 to-indigo-700 rounded-3xl p-6 md:p-8 text-white shadow-xl relative overflow-hidden">
            <div className="relative z-10 max-w-xl space-y-4">
              <span className="inline-block text-xs font-bold bg-white/20 px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-md">
                Plano Personalizado
              </span>
              <h2 className="text-2xl md:text-3xl font-extrabold leading-tight">
                Welcome back, {user.name}! Pronto para praticar hoje?
              </h2>
              <p className="text-brand-100 text-sm leading-relaxed">
                Você já completou {stats.timeStudiedToday} minutos hoje. Continue com seu tutor IA para manter sua ofensiva!
              </p>
              
              <div className="flex flex-wrap gap-3 pt-2">
                <button 
                  onClick={() => setActiveTab('tutor')}
                  className="bg-white text-brand-700 hover:bg-brand-50 font-bold px-5 py-3 rounded-xl text-sm transition shadow-lg flex items-center gap-2"
                >
                  <Icon name="video" className="w-4 h-4 text-brand-600" />
                  <span>Conversar com IA agora</span>
                </button>
                <button 
                  onClick={() => setActiveTab('exercises')}
                  className="bg-brand-800/60 hover:bg-brand-800 text-white border border-white/20 font-medium px-4 py-3 rounded-xl text-sm transition"
                >
                  Continuar Lição
                </button>
              </div>
            </div>

            <div className="hidden lg:block absolute right-8 top-1/2 -translate-y-1/2 opacity-20 hover:opacity-30 transition">
              <Icon name="bot" className="w-64 h-64 text-white" />
            </div>
          </div>

          {/* Cards de Métricas */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
              <div className="flex items-center gap-3 text-amber-500 mb-2">
                <Icon name="flame" className="w-5 h-5 fill-amber-500" />
                <span className="text-xs font-bold uppercase text-slate-400">Ofensiva</span>
              </div>
              <p className="text-2xl font-extrabold">{stats.streak} Dias</p>
              <p className="text-[11px] text-slate-500 mt-1">Recorde: 12 dias</p>
            </div>

            <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">

    // --- ROOM DE CONVERSAÇÃO / TUTOR VIRTUAL COM IA ---
    function TutorRoomView({ user, apiKey, setStats }) {
      const [personality, setPersonality] = useState("friendly"); // friendly, professional, travel
      const [messages, setMessages] = useState([
        { 
          id: 1, 
          sender: "tutor", 
          text: `Hello ${user.name || 'there'}! I am Alex, your English AI Tutor. How are you feeling today?`, 
          correction: null 
        }
      ]);
      const [inputMessage, setInputMessage] = useState("");
      const [isListening, setIsListening] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [speechSpeed, setSpeechSpeed] = useState(1);
      const [isCameraActive, setIsCameraActive] = useState(false);
      const [isMuted, setIsMuted] = useState(false);

      const messagesEndRef = useRef(null);
      const recognitionRef = useRef(null);

      // Scroll automático para a mensagem mais recente
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // Configuração Web Speech API (Speech Recognition)
      useEffect(() => {
        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          recognitionRef.current = new SpeechRecognition();
          recognitionRef.current.continuous = false;
          recognitionRef.current.interimResults = false;
          recognitionRef.current.lang = 'en-US';

          recognitionRef.current.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setInputMessage(transcript);
            setIsListening(false);
          };

          recognitionRef.current.onerror = () => setIsListening(false);
          recognitionRef.current.onend = () => setIsListening(false);
        }
      }, []);

      const toggleListening = () => {
        if (!recognitionRef.current) {
          alert("O seu navegador não suporta reconhecimento de voz diretamente. Use o Chrome ou Edge.");
          return;
        }

        if (isListening) {
          recognitionRef.current.stop();
          setIsListening(false);
        } else {
          try {
            recognitionRef.current.start();
            setIsListening(true);
          } catch (e) {
            console.error(e);
          }
        }
      };

      // Síntese de Voz (TTS)
      const speakText = (text) => {
        if (isMuted || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = speechSpeed;
        window.speechSynthesis.speak(utterance);
      };

      // Envio de Mensagem para Gemini API ou Mock Inteligente
      const handleSendMessage = async (e) => {
        e?.preventDefault();
        if (!inputMessage.trim()) return;

        const userText = inputMessage;
        setInputMessage("");
        
        // Adiciona mensagem do usuário ao histórico
        const newMsgObj = { id: Date.now(), sender: "user", text: userText };
        setMessages(prev => [...prev, newMsgObj]);
        setIsLoading(true);

        try {
          if (apiKey.trim()) {
            // Chamada Real à API Google Gemini
            const prompt = `Você é um tutor de inglês paciente e amigável chamado Alex. Responda em inglês ao aluno (${user.name}, nível ${user.level}). 
            Se o aluno cometeu um erro gramatical ou de vocabulário na frase abaixo, adicione uma pequena correção em português de forma construtiva.
            
            Entrada do Aluno: "${userText}"
            
            Retorne a resposta EXATAMENTE no seguinte formato JSON (sem markdown de bloco):
            {
              "reply": "Sua resposta natural em inglês para dar continuidade ao diálogo",
              "correction": "Se houver erro, explique aqui em português de forma amigável com exemplo. Se a frase estiver correta, coloque null."
            }`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text;
            const parsed = JSON.parse(rawText.replace(/```json|```/g, '').trim());

            setMessages(prev => [...prev, {
              id: Date.now() + 1,
              sender: "tutor",
              text: parsed.reply,
              correction: parsed.correction
            }]);

            speakText(parsed.reply);
          } else {
            // Fallback Simulado de Resposta Inteligente com Análise Gramatical Simples
            setTimeout(() => {
              let mockReply = "That's very interesting! Can you tell me more about that?";
              let mockCorrection = null;

              const textLower = userText.toLowerCase();

              // Detecção de erros comuns para demonstração
              if (textLower.includes("i am bad to")) {
                mockReply = "Don't worry! Everyone is learning. What do you enjoy doing most?";
                mockCorrection = "Dica: Em vez de 'bad to', diga 'bad at speaking'. Usamos 'bad at + verbo com -ing'.";
              } else if (textLower.includes("i have") && textLower.includes("years old")) {
                mockReply = "Got it! Thanks for sharing.";
                mockCorrection = "Dica: Para idades, usamos o verbo TO BE ('I am 20 years old'), e não o verbo HAVE.";
              } else if (textLower.length < 5) {
                mockReply = "Could you elaborate a bit more on that?";
              }

              setMessages(prev => [...prev, {
                id: Date.now() + 1,
                sender: "tutor",
                text: mockReply,
                correction: mockCorrection
              }]);

              speakText(mockReply);
            }, 1000);
          }

          // Atualizar XP por interação
          setStats(prev => ({ ...prev, xp: prev.xp + 10 }));

        } catch (err) {
          console.error("Erro na API de IA:", err);
          setMessages(prev => [...prev, {
            id: Date.now() + 1,
            sender: "tutor",
            text: "I understood you! Let's keep practicing.",
            correction: "Nota: Adicione sua Chave de API Gemini nas configurações para obter análises com IA em tempo real."
          }]);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="h-[calc(100vh-8rem)] flex flex-col bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl relative">
          {/* Header da Sala de Videochamada */}
          <div className="bg-slate-800/90 border-b border-slate-700/60 p-4 flex items-center justify-between backdrop-blur-md">
            <div className="flex items-center gap-3">
              <div className="relative">
                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center font-extrabold text-white shadow-md">
                  A
                </div>
                <span className="w-3 h-3 bg-emerald-500 border-2 border-slate-800 rounded-full absolute bottom-0 right-0"></span>
              </div>
              <div>
                <h3 className="font-bold text-white text-sm">Alex (Tutor Virtual IA)</h3>
                <span className="text-[10px] text-brand-400 font-medium">Nativo em Inglês • Suporte PT-BR</span>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button 
                onClick={() => setSpeechSpeed(prev => prev === 1 ? 0.75 : 1)}
                className="px-2.5 py-1 text-xs rounded-lg bg-slate-700 text-slate-200 hover:bg-slate-600 font-medium transition"
                title="Ajustar velocidade de fala do tutor"
              >
                {speechSpeed === 0.75 ? "Lento (0.75x)" : "Normal (1.0x)"}
              </button>
              
              <button 
                onClick={() => setIsMuted(!isMuted)}
                className={`p-2 rounded-lg transition ${isMuted ? 'bg-error/20 text-error' : 'bg-slate-700 text-slate-200'}`}
                title={isMuted ? "Áudio desativado" : "Áudio ativado"}
              >
                <Icon name={isMuted ? "volume-x" : "volume-2"} className="w-4 h-4" />
              </button>
            </div>
          </div>

          {/* Área Central: Visualização de Avatar / Câmera */}
          <div className="flex-1 bg-slate-950 p-4 flex flex-col justify-end relative overflow-y-auto custom-scrollbar">
            {/* Visualizador de Avatar do Tutor */}
            <div className="absolute top-6 left-1/2 -translate-x-1/2 flex flex-col items-center">
              <div className={`w-28 h-28 md:w-36 md:h-36 rounded-full bg-gradient-to-tr from-brand-600 via-indigo-600 to-purple-600 flex items-center justify-center shadow-2xl transition-transform ${isLoading ? 'scale-105 ring-4 ring-brand-500/50' : ''}`}>
                <Icon name="bot" className="w-16 h-16 md:w-20 md:h-20 text-white" />
              </div>
              <span className="mt-2 text-xs font-semibold text-slate-400 bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">
                {isLoading ? "Alex está pensando..." : "Alex está ouvindo você"}
              </span>
            </div>

            {/* Balões de Mensagens da Conversa */}
            <div className="space-y-4 pt-48 max-w-2xl mx-auto w-full">
              {messages.map((msg) => (
                <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                  <div className={`p-4 rounded-2xl max-w-[85%] text-sm shadow-md ${
                    msg.sender === 'user'
                      ? 'bg-brand-600 text-white rounded-br-none'
                      : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700'
                  }`}>
                    <p className="leading-relaxed">{msg.text}</p>
                    
                    {msg.sender === 'tutor' && (
                      <button 
                        onClick={() => speakText(msg.text)} 
                        className="mt-2 text-[10px] text-brand-400 hover:underline flex items-center gap-1 font-semibold"
                      >
                        <Icon name="volume-2" className="w-3 h-3" />
                        <span>Ouvir novamente</span>
                      </button>
                    )}
                  </div>

                  {/* Card de Correção Explicativa */}
                  {msg.correction && (
                    <div className="mt-2 p-3 bg-amber-950/40 border border-amber-500/30 rounded-xl max-w-[85%] text-xs text-amber-200 space-y-1">
                      <div className="flex items-center gap-1.5 font-bold text-amber-400">
                        <Icon name="sparkles" className="w-3.5 h-3.5" />
                        <span>Dica de Pronúncia / Gramática</span>
                      </div>
                      <p>{msg.correction}</p>
                    </div>
                  )}
                </div>
              ))}
              <div ref={messagesEndRef} />
            </div>
          </div>

          {/* Bar de Controles Inferior */}
          <div className="p-4 bg-slate-800/90 border-t border-slate-700/60 backdrop-blur-md">
            <form onSubmit={handleSendMessage} className="flex items-center gap-2 max-w-3xl mx-auto">
              <button
                type="button"
                onClick={toggleListening}
                className={`p-3.5 rounded-full text-white transition flex-shrink-0 shadow-lg ${
                  isListening 
                    ? 'bg-error animate-pulse ring-4 ring-error/30' 
                    : 'bg-slate-700 hover:bg-slate-600'
                }`}
                title={isListening ? "Parar de gravar" : "Falar no microfone"}
              >
                <Icon name={isListening ? "mic-off" : "mic"} className="w-5 h-5" />
              </button>

              <input
                type="text"
                placeholder={isListening ? "Ouvindo sua voz em inglês..." : "Digite sua mensagem em inglês..."}
                value={inputMessage}
                onChange={(e) => setInputMessage(e.target.value)}
                className="flex-1 bg-slate-900 border border-slate-700 text-white placeholder-slate-400 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500"
              />

              <button
                type="submit"
                disabled={isLoading || !inputMessage.trim()}
                className="bg-brand-600 hover:bg-brand-500 disabled:opacity-50 text-white p-3.5 rounded-full transition flex-shrink-0 shadow-lg shadow-brand-600/30"
              >
                <Icon name="send" className="w-5 h-5" />
              </button>
            </form>
          </div>
        </div>
      );
    }

      const currentEx = EXERCISES_DATABASE[currentIndex];

      const handleSubmit = () => {
        if (selectedOption === null) return;
        
        const correct = selectedOption === currentEx.answer;
        setIsCorrect(correct);
        setIsSubmitted(true);

        if (correct) {
          setStats(prev => ({ ...prev, xp: prev.xp + 20 }));
        }
      };

      const handleNext = () => {
        setSelectedOption(null);
        setIsSubmitted(false);
        setCurrentIndex((prev) => (prev + 1) % EXERCISES_DATABASE.length);
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-slate-400 uppercase">Exercício {currentIndex + 1} de {EXERCISES_DATABASE.length}</span>
            <span className="text-xs font-bold text-brand-600 bg-brand-50 px-3 py-1 rounded-full">+20 XP por acerto</span>
          </div>

          <div className="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-lg space-y-6">
            <h3 className="text-lg md:text-xl font-extrabold text-slate-900 dark:text-white leading-relaxed">
              {currentEx.question}
            </h3>

            {/* Opções de Múltipla Escolha */}
            <div className="space-y-3">
              {currentEx.options.map((opt, idx) => {
                let btnStyle = "border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50";
                
                if (selectedOption === idx) {
                  btnStyle = "border-brand-500 bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 font-bold";
                }

                if (isSubmitted) {
                  if (idx === currentEx.answer) {
                    btnStyle = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 font-bold";
                  } else if (selectedOption === idx) {
                    btnStyle = "border-error bg-red-50 dark:bg-red-950/50 text-error font-bold";
                  }
                }

                return (
                  <button
                    key={idx}
                    disabled={isSubmitted}
                    onClick={() => setSelectedOption(idx)}
                    className={`w-full p-4 rounded-2xl border text-left text-sm transition flex items-center justify-between ${btnStyle}`}
                  >
                    <span>{opt}</span>
                    {isSubmitted && idx === currentEx.answer && (
                      <Icon name="check-circle" className="w-5 h-5 text-emerald-500" />
                    )}
                  </button>
                );
              })}
            </div>

            {/* Feedback e Explicação */}
            {isSubmitted && (
              <div className={`p-4 rounded-2xl border text-sm space-y-2 ${
                isCorrect ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500/30 text-emerald-800 dark:text-emerald-300' : 'bg-red-50 dark:bg-red-950/30 border-red-500/30 text-red-800 dark:text-red-300'
              }`}>
                <div className="flex items-center gap-2 font-bold">
                  <Icon name={isCorrect ? "check-circle" : "alert-circle"} className="w-5 h-5" />
                  <span>{isCorrect ? "Excelente! Resposta correta." : "Ainda não foi dessa vez!"}</span>
                </div>
                <p className="text-xs leading-relaxed">{currentEx.explanation}</p>
              </div>
            )}

            {/* Ação */}
            {!isSubmitted ? (
              <button
                onClick={handleSubmit}
                disabled={selectedOption === null}
                className="w-full bg-brand-600 hover:bg-brand-500 disabled:opacity-50 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-brand-600/30"
              >
                Verificar Resposta
              </button>
            ) : (
              <button
                onClick={handleNext}
                className="w-full bg-slate-900 dark:bg-white dark:text-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg"
              >
                Próximo Exercício
              </button>
            )}
          </div>
        </div>
      );
    }

    // --- VISUALIZAÇÃO DE PROGRESSO ---
    function ProgressView({ stats, user }) {
      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl font-extrabold">Seu Relatório de Desempenho</h2>
            <p className="text-xs text-slate-500 dark:text-slate-400">Acompanhamento contínuo baseado no CEFR</p>
          </div>

          <div className="grid md:grid-cols-2 gap-6">
            <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
              <h3 className="font-bold text-base">Habilidades Avaliadas</h3>
              
              {[
                { skill: "Fluência Oral (Speaking)", score: 68 },
                { skill: "Compreensão Auditiva (Listening)", score: 82 },
                { skill: "Gramática & Estrutura", score: 75 },
                { skill: "Vocabulário", score: 90 }
              ].map((item, idx) => (
                <div key={idx} className="space-y-1">
                  <div className="flex justify-between text-xs font-semibold">
                    <span>{item.skill}</span>
                    <span className="text-brand-600">{item.score}%</span>
                  </div>
                  <div className="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                    <div className="bg-brand-600 h-full rounded-full" style={{ width: `${item.score}%` }}></div>
                  </div>
                </div>
              ))}
            </div>

            <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
              <h3 className="font-bold text-base">Medalhas e Conquistas</h3>
              
              <div className="grid grid-cols-3 gap-3">
                {[
                  { title: "Primeira Conversa", desc: "Completou 1 conversa com IA", icon: "message-square", unlocked: true },
                  { title: "Dedicado", desc: "5 dias de ofensiva", icon: "flame", unlocked: true },
                  { title: "Poliglota em Ação", desc: "Alcançou nível B2", icon: "award", unlocked: false }
                ].map((item, idx) => (
                  <div key={idx} className={`p-3 rounded-2xl border text-center flex flex-col items-center space-y-2 ${
                    item.unlocked ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-300 dark:border-amber-800' : 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-800 opacity-50'
                  }`}>
                    <Icon name={item.icon} className={`w-6 h-6 ${item.unlocked ? 'text-amber-500' : 'text-slate-400'}`} />
                    <span className="text-[11px] font-bold leading-tight">{item.title}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL DE CONFIGURAÇÕES ---
    function SettingsModal({ apiKey, onSaveApiKey, onClose }) {
      const [keyInput, setKeyInput] = useState(apiKey);

      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-800 max-w-md w-full rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-2xl space-y-5">
            <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
              <h3 className="font-extrabold text-lg">Configurações do Sistema</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="space-y-3">
              <label className="text-xs font-bold text-slate-500 uppercase">Chave de API do Google Gemini</label>
              <p className="text-xs text-slate-400">
                Insira sua chave para habilitar respostas em tempo real personalizadas com Inteligência Artificial avançada.
              </p>
              <input
                type="password"
                placeholder="Cole sua API Key aqui (AIzaSy...)"
                value={keyInput}
                onChange={(e) => setKeyInput(e.target.value)}
                className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500"
              />
            </div>

            <div className="flex gap-3 pt-2">
              <button onClick={onClose} className="w-1/2 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold">Cancelar</button>
              <button 
                onClick={() => {
                  onSaveApiKey(keyInput);
                  onClose();
                }} 
                className="w-1/2 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold transition"
              >
                Salvar Chave
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- RENDERIZAÇÃO PRINCIPAL ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
